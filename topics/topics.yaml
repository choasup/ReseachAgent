# 追踪主题清单 + 研究兴趣画像
# 用 /track <主题> 拉该方向新论文；筛选时按下面 preferences 的口味打分。

# === 研究兴趣画像（筛论文/排序时遵守）===
preferences:
  likes:
    - 工程化、能落地：有清晰实现、可复现、即插即用 / 训练-free 的方法
    - 小而美：idea 干净、改动小但有效，不堆资源的工作
    - 出身好：国际知名高校（Stanford/MIT/CMU/Berkeley/Oxford/清华等）或大企业
      （Google/DeepMind/Meta/Microsoft/Apple/NVIDIA/OpenAI 等）的工作
  focus:
    - LLM / 多模态 Agent（tool use、GUI/computer-use agent、multi-agent、planning）
    - VLM / 多模态大模型（高效化、对齐、推理、RAG 注入、可解释）
  deprioritize:
    - 纯刷点、改动大却收益小、依赖海量私有数据才能复现的工作

# === 订阅主题 ===
topics:
  - slug: agents
    name: LLM / 多模态 Agent
    keywords: [LLM agent, multimodal agent, GUI agent, computer use, tool use, multi-agent, planning, agentic]
    cadence: weekly
    watch:   # 方法线（2026-07-11 设立）
      - "★ harness 演化集群（2026-08-12 设立）：EvoHarness-RL 2608.05446 纵向训练化 /
         EvolveNet 2608.04968 横向联邦化 / Self-Harness 2606.09498 / HarnessX 2606.14249 /
         DemoEvolve 2605.24539 / EvoTrainer 2606.03108 —— 盯两条路线谁先合流"
      - 过程奖励 for GUI agent（VisCritic/GUI-Shepherd/StainFlow 一线，半年5篇未定论，盯统一者）
      - MolmoPoint 后续（grounding tokens → GUI grounding 基建）
      - R-WoM 一线（RAG×世界模型 for computer-use）

  - slug: vlm
    name: VLM / 多模态大模型
    keywords: [vision-language model, multimodal LLM, VLM efficiency, visual reasoning, VLM RAG, training-free]
    cadence: weekly
    watch:   # 方法线（2026-07-11 设立）
      - "推理伤感知"修复线（Deeper Thought/AV-Reasoner/NoRD/Thinking Diffusion 四证据链，盯后续修复方案）
      - 解耦感知与推理·长视频（HPP/MemDreamer/VideoARM 同期共识，盯集大成者）
      - 监督信号工程范式（World2VLM/ReasonX/ZwZ："用生成器造监督"的新实例）
      - 深读候选存货：TTRV、Why RL>SFT、PDCR、CodeDance（见 topics/vlm.md 80篇详析）

  - slug: inspection-anomaly-benchmark
    name: 巡检/异常检测的 VLM Benchmark
    keywords: [industrial anomaly detection benchmark, MLLM anomaly detection, surveillance video anomaly, compliance analysis benchmark, inspection VLM, Zoom-Bench, Zooming without Zooming, MME-RealWorld, RealWorldQA, fine-grained perception]
    cadence: weekly
    watch:   # 重点追踪对象（2026-07-09 设立）
      - Zoom-Bench / ZwZ（inclusionAI/Zooming-without-Zooming, arXiv 2602.11858）
      - MME-RealWorld（MME-Benchmarks/MME-RealWorld, arXiv 2408.13257）
      - RealWorldQA（xai-org/RealworldQA）
