# 追踪主题清单 + 研究兴趣画像
# 用 /track <主题> 拉该方向新论文；筛选时按下面 preferences 的口味打分。

# === 研究兴趣画像（筛论文/排序时遵守）===
preferences:
  likes:
    - 工程化、能落地：有清晰实现、可复现、即插即用 / 训练-free 的方法
    - 小而美：idea 干净、改动小但有效，不堆资源的工作
    - 出身好：国际知名高校（Stanford/MIT/CMU/Berkeley/Oxford/清华等）或大企业
      （Google/DeepMind/Meta/Microsoft/Apple/NVIDIA/OpenAI 等）的工作
  focus:
    - LLM / 多模态 Agent（tool use、GUI/computer-use agent、multi-agent、planning）
    - VLM / 多模态大模型（高效化、对齐、推理、RAG 注入、可解释）
  deprioritize:
    - 纯刷点、改动大却收益小、依赖海量私有数据才能复现的工作

# === 订阅主题 ===
topics:
  - slug: agents
    name: LLM / 多模态 Agent
    keywords: [LLM agent, multimodal agent, GUI agent, computer use, tool use, multi-agent, planning, agentic]
    cadence: weekly

  - slug: vlm
    name: VLM / 多模态大模型
    keywords: [vision-language model, multimodal LLM, VLM efficiency, visual reasoning, VLM RAG, training-free]
    cadence: weekly
