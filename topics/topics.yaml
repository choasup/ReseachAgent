  - slug: agents
    name: LLM Agents
    keywords: [LLM agent, tool use, multi-agent, agentic, planning]
    cadence: weekly

  - slug: rl-reasoning
    name: 强化学习 / 推理
    keywords: [RLHF, reasoning, RLVR, chain-of-thought, test-time compute]
    cadence: weekly
